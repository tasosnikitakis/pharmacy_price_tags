# Core and Postgres for development and the shop box. The gateway is not here:
# Bluetooth inside containers is unreliable, so it runs natively under systemd.
#
# Secrets are required and have no defaults (docs/decisions/0010). Generate them with
#   python -m core.gen_secrets >> .env
# Postgres publishes no port: only core reaches it, over the Compose network.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: esl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: esl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esl -d esl"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  core:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://esl:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/esl
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${CORE_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
