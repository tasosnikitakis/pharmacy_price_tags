# Core and Postgres for development and the shop box. The gateway is not here:
# Bluetooth inside containers is unreliable, so it runs natively under systemd.
#
# Set POSTGRES_PASSWORD in .env for anything but local development.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: esl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esl}
      POSTGRES_DB: esl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esl -d esl"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  core:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://esl:${POSTGRES_PASSWORD:-esl}@db:5432/esl
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${CORE_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
