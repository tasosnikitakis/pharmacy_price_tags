# Core and Postgres for development and the shop box. The gateway is not here:
# Bluetooth inside containers is unreliable, so it runs natively under systemd.
#
# Secrets are required and have no defaults (docs/decisions/0010). Generate them with
#   python -m core.gen_secrets >> .env
# Compose passes them as secret files under /run/secrets, never as plain environment
# values, and refuses to start if one is unset.
# Postgres publishes no port: only core reaches it, over the Compose network.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: esl
      POSTGRES_DB: esl
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esl -d esl"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  core:
    build: .
    environment:
      # No password here: core adds it from /run/secrets/database_password.
      DATABASE_URL: postgresql+psycopg://esl@db:5432/esl
    secrets: [database_password, session_secret, gateway_token]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${CORE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

secrets:
  database_password:
    environment: POSTGRES_PASSWORD
  session_secret:
    environment: SESSION_SECRET
  gateway_token:
    environment: GATEWAY_TOKEN

volumes:
  pgdata:
